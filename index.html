<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caja registradora</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mut:#667085;--bd:#e2e5ea;--ac:#2563eb;--ac2:#fff;--dg:#dc2626;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212b;--tx:#e8ecf1;--mut:#98a2b3;--bd:#2b3340;--ac:#5b8def;--dg:#f87171;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212b;--tx:#e8ecf1;--mut:#98a2b3;--bd:#2b3340;--ac:#5b8def;--dg:#f87171;--ok:#4ade80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 24px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:.95rem;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:1rem;margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font-size:1rem;cursor:pointer;margin-top:10px}
.btn.s{background:transparent;color:var(--mut);border:1px solid var(--bd);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.prod{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;text-align:left;cursor:pointer;font-size:.95rem}
.prod:active{transform:scale(.97)}
.prod b{display:block;margin-bottom:4px}.prod span{color:var(--ac);font-weight:700}.prod small{display:block;color:var(--mut)}
.prod:disabled{opacity:.4}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item small{color:var(--mut);display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1.1rem;cursor:pointer}
.acts button{background:none;border:0;color:var(--ac);font-size:.9rem;cursor:pointer;padding:6px}
.acts .d{color:var(--dg)}
.price{font-weight:600;white-space:nowrap}
.total{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:700;padding-top:10px}
.pay{width:100%;font-size:1.15rem;padding:14px;background:var(--ok);margin-top:10px}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.msg{background:var(--ok);color:#fff;padding:10px;border-radius:8px;margin-bottom:12px;display:none;text-align:center}
body{font-size:18px}
input,select{padding:14px;font-size:1.1rem}
.btn{padding:14px 22px;font-size:1.1rem;border-radius:12px}
.tabs button{padding:14px 2px;font-size:1rem;border-radius:12px}
h2{font-size:1.15rem;display:flex;align-items:center;gap:10px;margin:0 0 10px}
.n{background:var(--ac);color:var(--ac2);width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.grid{grid-template-columns:1fr}
.prod{padding:16px;font-size:1.1rem;border:2px solid var(--ac);border-radius:14px}
.prod b{font-size:1.15rem}.prod span{font-size:1.4rem}
.qty button{width:44px;height:44px;font-size:1.4rem;border-radius:12px}
.total{font-size:2.2rem}
.pay{font-size:1.5rem;padding:20px}
.acts button{font-size:1rem;padding:10px}
.msg{font-size:1.2rem;padding:16px}
.ent{margin-top:6px;padding:8px 14px;border-radius:20px;border:2px solid var(--bd);background:var(--bg);color:var(--mut);font-size:1rem;cursor:pointer}.ent.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="msg" id="msg"></div>
  <div class="tabs">
    <button id="t-caja" class="on" onclick="tab('caja')">🧾 Caja</button>
    <button id="t-c" onclick="tab('c')">👥 Clientes</button>
    <button id="t-p" onclick="tab('p')">📦 Productos</button>
    <button id="t-v" onclick="tab('v')">📊 Ventas</button>
  </div>

  <!-- CAJA -->
  <div id="v-caja">
    <div class="card">
      <h2><span class="n">1</span> ¿Quién compra?</h2>
      <input id="sel-cli" list="cli-list" placeholder="Escribe el nombre (si no lo sabes, déjalo vacío)" autocomplete="off"><datalist id="cli-list"></datalist>
    </div>
    <div class="card">
      <h2><span class="n">2</span> Escribe el número del producto</h2>
      <input id="q-caja" placeholder="🔍 Número, por ejemplo 302" inputmode="numeric" oninput="renderCaja()">
      <div class="grid" id="grid"></div>
    </div>
    <div class="card">
      <h2><span class="n">3</span> Lo que se lleva</h2>
      <div id="cart"></div>
      <div class="total"><span>Total</span><span id="tot">0,00 €</span></div>
      <div style="display:flex;justify-content:space-between;color:var(--mut)"><span>Beneficio</span><span id="ben">0,00 €</span></div>
      <button class="btn pay" onclick="pedirCobro()">✅ Cobrar</button>
      <button class="btn s" style="width:100%;margin:8px 0 0" onclick="cart=[];renderCaja()">Empezar de nuevo</button>
    </div>
  </div>

  <!-- CLIENTES -->
  <div id="v-c" style="display:none">
    <div class="card">
      <div class="row">
        <div><label>Nombre *</label><input id="c-nom"></div>
        <div><label>Teléfono</label><input id="c-tel" type="tel"></div>
        <div><label>Email</label><input id="c-mail" type="email"></div>
        <div><label>Dirección</label><input id="c-dir"></div>
      </div>
      <button class="btn" onclick="saveC()" id="c-btn">Agregar cliente</button>
      <button class="btn s" id="c-x" onclick="resetC()" style="display:none">Cancelar</button>
    </div>
    <div class="card" id="c-list"></div>
  </div>

  <!-- PRODUCTOS -->
  <div id="v-p" style="display:none">
    <div class="card">
      <div class="row">
        <div><label>Producto *</label><input id="p-nom"></div>
        <div><label>Precio *</label><input id="p-pre" type="number" min="0" step="0.01"></div>
        <div><label>Código / SKU</label><input id="p-cod"></div>
        <div><label>Costo</label><input id="p-cost" type="number" min="0" step="0.01"></div>
        <div><label>Stock (vacío = sin control)</label><input id="p-stk" type="number" min="0" step="1"></div>
      </div>
      <button class="btn" onclick="saveP()" id="p-btn">Agregar producto</button>
      <button class="btn s" id="p-x" onclick="resetP()" style="display:none">Cancelar</button>
    </div>
    <input id="p-q" placeholder="🔍 Buscar producto o referencia..." oninput="render()" style="margin-bottom:10px">
    <div class="card" id="p-list"></div>
  </div>

  <!-- VENTAS -->
  <div id="v-v" style="display:none">
    <div class="card"><h2>Ventas de hoy</h2><div class="total" style="padding:0"><span id="v-n"></span><span id="v-hoy"></span></div>
      <div style="display:flex;justify-content:space-between;color:var(--mut);margin-top:4px"><span>Beneficio de hoy</span><span id="v-ben"></span></div>
      <div style="display:flex;justify-content:space-between;color:var(--mut);margin-top:4px"><span>Pendientes de entregar</span><span id="v-pend"></span></div>
      <button class="btn s" style="margin:10px 0 0;color:var(--dg)" onclick="delAll()">Borrar todas las ventas</button></div>
    <div class="card" id="v-list"></div>
  </div>
</div>

<div id="ask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:20px;z-index:10">
  <div class="card" style="max-width:320px;width:100%;margin:0;text-align:center">
    <p id="ask-t" style="margin:4px 0 8px;font-size:1.05rem"></p>
    <button class="btn" id="ask-ok" style="background:var(--dg)" onclick="askOk(true)">Borrar</button>
    <button class="btn s" onclick="askOk(false)">Cancelar</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let db={clients:[],products:[],sales:[]},editC=null,editP=null,cart=[];
try{const s=localStorage.getItem('registro_db');if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
function persist(){try{localStorage.setItem('registro_db',JSON.stringify(db))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hasStk=p=>p.stk!==''&&p.stk!=null&&!isNaN(Number(p.stk));

function tab(t){
  for(const k of ['caja','c','p','v']){$('v-'+k).style.display=k===t?'':'none';$('t-'+k).classList.toggle('on',k===t)}
  render();
}
function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}

/* ---------- CAJA ---------- */
function inCart(id){const x=cart.find(i=>i.id===id);return x?x.qty:0}
function add(id){
  const p=db.products.find(x=>x.id===id);if(!p)return;
  if(hasStk(p)&&inCart(id)>=Number(p.stk))return;
  const x=cart.find(i=>i.id===id);x?x.qty++:cart.push({id,qty:1});$('q-caja').value='';renderCaja();
}
function chg(id,d){
  const x=cart.find(i=>i.id===id),p=db.products.find(y=>y.id===id);if(!x)return;
  if(d>0&&hasStk(p)&&x.qty>=Number(p.stk))return;
  x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);renderCaja();
}
function ben(){return cart.reduce((s,i)=>{const p=db.products.find(x=>x.id===i.id);return s+(p&&p.cost!==''&&p.cost!=null?(p.pre-p.cost)*i.qty:0)},0)}
const byRef=(a,b)=>(parseFloat(a.cod)||1e9)-(parseFloat(b.cod)||1e9)||a.nom.localeCompare(b.nom);
function total(){return cart.reduce((s,i)=>{const p=db.products.find(x=>x.id===i.id);return s+(p?p.pre*i.qty:0)},0)}
function renderCaja(){
  $('cli-list').innerHTML=db.clients.map(c=>`<option value="${esc(c.nom)}"></option>`).join('');
  const q=$('q-caja').value.trim().toLowerCase();
  const ps=q?db.products.filter(p=>String(p.cod).toLowerCase().includes(q)).sort(byRef):[];
  $('grid').innerHTML=ps.length?ps.map(p=>{
    const left=hasStk(p)?Number(p.stk)-inCart(p.id):null;
    return `<button class="prod" ${left!==null&&left<=0?'disabled':''} onclick="add('${p.id}')"><small>Ref ${esc(p.cod)}</small><b>${esc(p.nom)}</b><span>${money(p.pre)}</span>${left!==null?`<small>Stock: ${left}</small>`:''}</button>`}).join('')
    :'<div class="empty" style="grid-column:1/-1">'+(q?'No hay productos con esa referencia':'Escribe el número del producto arriba 👆')+'</div>';
  $('cart').innerHTML=cart.length?cart.map(i=>{const p=db.products.find(x=>x.id===i.id);
    return `<div class="item"><div><b>${esc(p.nom)}</b><small>${money(p.pre)} c/u</small></div>
    <div class="qty"><button onclick="chg('${i.id}',-1)">−</button><b>${i.qty}</b><button onclick="chg('${i.id}',1)">+</button></div>
    <div class="price">${money(p.pre*i.qty)}</div></div>`}).join(''):'<div class="empty">Aún no hay nada. Escribe un número arriba y toca el producto.</div>';
  $('tot').textContent=money(total());$('ben').textContent=money(ben());
}
function cobrar(){
  if(!cart.length){flash('Primero añade algún producto');return}
  const nombre=$('sel-cli').value.trim();
  let nuevo=false;
  if(nombre&&!db.clients.some(x=>x.nom.toLowerCase()===nombre.toLowerCase())){db.clients.push({id:uid(),nom:nombre,tel:'',mail:'',dir:''});nuevo=true}
  const items=cart.map(i=>{const p=db.products.find(x=>x.id===i.id);return{nom:p.nom,pre:p.pre,qty:i.qty,cod:p.cod}});
  db.sales.unshift({id:uid(),fecha:new Date().toISOString(),cliente:nombre||'Consumidor final',items,total:total(),ben:ben(),tel:(db.clients.find(x=>x.nom.toLowerCase()===nombre.toLowerCase())||{}).tel||''});
  cart.forEach(i=>{const p=db.products.find(x=>x.id===i.id);if(hasStk(p))p.stk=String(Number(p.stk)-i.qty)});
  const t=total();cart=[];$('sel-cli').value='';persist();renderCaja();flash('🎉 ¡Venta hecha! Total: '+money(t)+(nuevo?' · Cliente nuevo guardado':''));scrollTo(0,0);
}

/* ---------- CLIENTES ---------- */
function saveC(){
  const nom=$('c-nom').value.trim();if(!nom){$('c-nom').focus();return}
  const o={nom,tel:$('c-tel').value.trim(),mail:$('c-mail').value.trim(),dir:$('c-dir').value.trim()};
  if(editC)Object.assign(db.clients.find(x=>x.id===editC),o);else db.clients.push({id:uid(),...o});
  persist();resetC();
}
function resetC(){editC=null;['nom','tel','mail','dir'].forEach(k=>$('c-'+k).value='');
  $('c-btn').textContent='Agregar cliente';$('c-x').style.display='none';render()}
function editClient(id){const c=db.clients.find(x=>x.id===id);editC=id;
  $('c-nom').value=c.nom;$('c-tel').value=c.tel;$('c-mail').value=c.mail;$('c-dir').value=c.dir;
  $('c-btn').textContent='Guardar cambios';$('c-x').style.display='';scrollTo(0,0)}
function delClient(id){ask('¿Eliminar este cliente?',()=>{db.clients=db.clients.filter(x=>x.id!==id);persist();render()})}

/* ---------- PRODUCTOS ---------- */
function saveP(){
  const nom=$('p-nom').value.trim(),pre=parseFloat($('p-pre').value);
  if(!nom){$('p-nom').focus();return}
  if(isNaN(pre)||pre<0){$('p-pre').focus();return}
  const o={nom,pre,cod:$('p-cod').value.trim(),stk:$('p-stk').value,cost:$('p-cost').value};
  if(editP)Object.assign(db.products.find(x=>x.id===editP),o);else db.products.push({id:uid(),...o});
  persist();resetP();
}
function resetP(){editP=null;['nom','pre','cod','stk','cost'].forEach(k=>$('p-'+k).value='');
  $('p-btn').textContent='Agregar producto';$('p-x').style.display='none';render()}
function editProd(id){const p=db.products.find(x=>x.id===id);editP=id;
  $('p-nom').value=p.nom;$('p-pre').value=p.pre;$('p-cod').value=p.cod;$('p-stk').value=p.stk;$('p-cost').value=p.cost??'';
  $('p-btn').textContent='Guardar cambios';$('p-x').style.display='';scrollTo(0,0)}
function delProd(id){ask('¿Eliminar este producto?',()=>{db.products=db.products.filter(x=>x.id!==id);cart=cart.filter(i=>i.id!==id);persist();render()})}

function toggleEnt(id){const v=db.sales.find(x=>x.id===id);if(v){v.ent=!v.ent;persist();render()}}
function delSale(id){ask('¿Borrar esta venta? El stock no se devuelve.',()=>{db.sales=db.sales.filter(x=>x.id!==id);persist();render()})}
function delAll(){if(db.sales.length)ask('¿Borrar TODAS las ventas? No se puede deshacer.',()=>{db.sales=[];persist();render()})}
let askCb=null;
function ask(t,cb,ok,col){askCb=cb;$('ask-t').textContent=t;$('ask-ok').textContent=ok||'Borrar';$('ask-ok').style.background=col||'var(--dg)';$('ask').style.display='flex'}
function pedirCobro(){if(!cart.length){flash('Primero añade algún producto');return}ask('¿Cobrar '+money(total())+'?',cobrar,'Sí, cobrar','var(--ok)')}
function askOk(ok){$('ask').style.display='none';const f=askCb;askCb=null;if(ok&&f)f()}

/* ---------- RENDER ---------- */
function render(){
  renderCaja();
  $('c-list').innerHTML=db.clients.length?db.clients.map(c=>`<div class="item"><div><b>${esc(c.nom)}</b><small>${[c.tel,c.mail,c.dir].filter(Boolean).map(esc).join(' · ')}</small></div>
    <div class="acts"><button onclick="editClient('${c.id}')">Editar</button><button class="d" onclick="delClient('${c.id}')">Borrar</button></div></div>`).join(''):'<div class="empty">Sin clientes</div>';
  const qq=$('p-q').value.toLowerCase(),pl=db.products.filter(p=>(p.nom+p.cod).toLowerCase().includes(qq)).sort(byRef);
  $('p-list').innerHTML=pl.length?pl.map(p=>`<div class="item"><div><b>${esc(p.nom)}</b><small>${[p.cod&&'Ref '+esc(p.cod),p.cost!==''&&p.cost!=null&&'Costo '+money(p.cost)+' · Beneficio '+money(p.pre-p.cost),hasStk(p)&&'Stock '+esc(p.stk)].filter(Boolean).join(' · ')}</small></div>
    <div class="price">${money(p.pre)}</div>
    <div class="acts"><button onclick="editProd('${p.id}')">Editar</button><button class="d" onclick="delProd('${p.id}')">Borrar</button></div></div>`).join(''):'<div class="empty">Sin productos</div>';
  const hoy=new Date().toDateString(),sh=db.sales.filter(s=>new Date(s.fecha).toDateString()===hoy);
  $('v-pend').textContent=db.sales.filter(x=>!x.ent).length;$('v-n').textContent=sh.length+' venta'+(sh.length===1?'':'s');
  $('v-hoy').textContent=money(sh.reduce((a,s)=>a+s.total,0));$('v-ben').textContent=money(sh.reduce((a,s)=>a+(s.ben||0),0));
  $('v-list').innerHTML=db.sales.length?db.sales.map(s=>`<div class="item"><div><b>${esc(s.cliente)}</b>${(()=>{const t=s.tel||(db.clients.find(c=>c.nom.toLowerCase()===s.cliente.toLowerCase())||{}).tel;return t?'<small>📞 '+esc(t)+'</small>':''})()}
    <small>${new Date(s.fecha).toLocaleString('es',{dateStyle:'short',timeStyle:'short'})}</small>
    ${s.items.map(i=>{const c=i.cod||(db.products.find(p=>p.nom===i.nom)||{}).cod;return '<small>'+i.qty+'× '+(c?'Ref '+esc(c)+' · ':'')+esc(i.nom)+'</small>'}).join('')}${s.ben!=null?'<small>Beneficio: '+money(s.ben)+'</small>':''}<div><button class="ent ${s.ent?'ok':''}" onclick="toggleEnt('${s.id}')">${s.ent?'✅ Entregado':'⏳ Sin entregar'}</button></div></div><div class="price">${money(s.total)}</div><div class="acts"><button class="d" onclick="delSale('${s.id}')">Borrar</button></div></div>`).join(''):'<div class="empty">Todavía no hay ventas</div>';
}

/* ---------- CATÁLOGO CANARIAS 2026 ---------- */
/* formato: ref;nombre;costo;pvp  |  S;refInicial;nombre base;medida:costo:pvp,... */
const CAT={b1:`239;Molde Plum Cake;6;9
240;Molde Cake - Tarta;6;9

242;Molde Desmontable de Dos Fondos;10;14

270;Gofrera;17;24

272;Sandwichera 2 Sándwiches;17;24
273;Grill Parrilla Doble;29.5;39.5
